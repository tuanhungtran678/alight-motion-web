<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alight Motion Web Lite</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section id="homeScreen" class="screen active">
        <header class="topbar">
          <h1>Alight Motion Web Lite</h1>
          <p>Màn hình chính quản lý dự án.</p>
        </header>

        <article class="panel">
          <h2>Tạo dự án mới</h2>
          <label>Tên dự án <input id="newProjectName" type="text" placeholder="Ví dụ: Intro TikTok" /></label>
          <button id="createProjectBtn" class="btn primary">+ Tạo dự án</button>
        </article>

        <article class="panel">
          <h2>Danh sách dự án</h2>
          <div id="projectList" class="project-list"></div>
        </article>
      </section>

      <section id="editorScreen" class="screen">
        <header class="topbar row-between">
          <div>
            <h1 id="projectTitle">Editor</h1>
            <p id="projectMeta">-</p>
          </div>
          <button id="backHomeBtn" class="btn">← Về màn hình chính</button>
        </header>

        <section class="preview-card">
          <div class="phone-stage">
            <canvas id="preview" width="360" height="640" aria-label="Khung preview"></canvas>
          </div>
          <div class="transport">
            <button id="playBtn" class="btn primary">▶ Phát</button>
            <button id="pauseBtn" class="btn">⏸ Dừng</button>
            <button id="resetBtn" class="btn">↺ Reset</button>
            <label>
              Tua
              <input id="scrubber" type="range" min="0" max="100" value="0" />
            </label>
            <span id="timeLabel">0.00s / 2.00s</span>
          </div>
        </section>

        <section class="panel-grid">
          <article class="panel">
            <h2>Tạo layer</h2>
            <div class="button-grid">
              <button id="addRect" class="btn">+ Hình chữ nhật</button>
              <button id="addCircle" class="btn">+ Hình tròn</button>
              <button id="addText" class="btn">+ Text</button>
            </div>
            <label>Chèn hình ảnh <input id="imageInput" type="file" accept="image/*" /></label>
            <button id="addImageBtn" class="btn">+ Thêm ảnh</button>
            <label>Layer hiện tại <select id="layerSelect"></select></label>
            <button id="deleteLayer" class="btn danger">Xóa layer</button>
          </article>

          <article class="panel">
            <h2>Thiết lập chuyển động</h2>
            <label>Thời lượng animation (giây) <input id="timelineDuration" type="number" min="0.2" step="0.1" value="2" /></label>
            <div class="field-grid">
              <label>X <input id="startX" type="number" value="180" /></label>
              <label>Y <input id="startY" type="number" value="320" /></label>
              <label>Scale <input id="startScale" type="number" step="0.1" value="1" /></label>
              <label>Rotate° <input id="startRotation" type="number" value="0" /></label>
              <label>Opacity <input id="startOpacity" type="number" step="0.05" min="0" max="1" value="1" /></label>
            </div>
            <div class="field-grid">
              <label>X <input id="endX" type="number" value="180" /></label>
              <label>Y <input id="endY" type="number" value="180" /></label>
              <label>Scale <input id="endScale" type="number" step="0.1" value="1.5" /></label>
              <label>Rotate° <input id="endRotation" type="number" value="360" /></label>
              <label>Opacity <input id="endOpacity" type="number" step="0.05" min="0" max="1" value="1" /></label>
            </div>
            <label>Ease
              <select id="easing">
                <option value="linear">Linear</option>
                <option value="easeIn">Ease In</option>
                <option value="easeOut">Ease Out</option>
                <option value="easeInOut" selected>Ease In Out</option>
                <option value="custom">Custom Graph</option>
              </select>
            </label>
            <canvas id="easeGraph" width="320" height="180"></canvas>
            <div class="field-grid">
              <label>P1 X <input id="cp1x" type="range" min="0" max="1" step="0.01" value="0.25" /></label>
              <label>P1 Y <input id="cp1y" type="range" min="0" max="1" step="0.01" value="0.1" /></label>
              <label>P2 X <input id="cp2x" type="range" min="0" max="1" step="0.01" value="0.25" /></label>
              <label>P2 Y <input id="cp2y" type="range" min="0" max="1" step="0.01" value="1" /></label>
            </div>
            <button id="applyBtn" class="btn primary">Áp dụng vào layer</button>
          </article>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
