<!doctype html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alight Motion Web Lite</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section id="homeScreen" class="screen active">
        <header class="topbar">
          <h1>Alight Motion Web Lite</h1>
          <p>Màn hình chính quản lý dự án.</p>
        </header>

        <article class="panel">
          <h2>Tạo dự án mới</h2>
          <button id="createProjectBtn" class="btn primary">+ Tạo dự án mới</button>
        </article>

        <article class="panel">
          <h2>Danh sách dự án</h2>
          <div id="projectList" class="project-list"></div>
        </article>
      </section>

      <section id="editorScreen" class="screen">
        <header class="topbar row-between">
          <div>
            <h1 id="projectTitle">Editor</h1>
            <p id="projectMeta">-</p>
          </div>
          <div class="header-actions">
            <button id="themeToggleBtn" class="btn">☀/🌙</button>
            <button id="openMenuBtn" class="btn">⚙</button>
            <button id="backHomeBtn" class="btn">← Home</button>
          </div>
        </header>

        <section class="preview-card">
          <div class="phone-stage">
            <canvas id="preview" width="360" height="640"></canvas>
          </div>
          <div class="transport">
            <button id="playBtn" class="btn primary">▶ Phát</button>
            <button id="pauseBtn" class="btn">⏸ Dừng</button>
            <button id="resetBtn" class="btn">↺ Reset</button>
            <button id="exportVideoBtn" class="btn">⤓ Xuất Video MP4</button>
            <label>Tua <input id="scrubber" type="range" min="0" max="100" value="0" /></label>
            <span id="timeLabel">0.00s / 2.00s</span>
          </div>
        </section>

        <section class="panel-grid">
          <article class="panel">
            <h2>Layer</h2>
            <div class="button-grid">
              <button id="addRect" class="btn">+ Hình chữ nhật</button>
              <button id="addCircle" class="btn">+ Hình tròn</button>
              <button id="addText" class="btn">+ Text</button>
            </div>
            <label>Chèn hình ảnh <input id="imageInput" type="file" accept="image/*" /></label>
            <button id="addImageBtn" class="btn">+ Thêm ảnh</button>
            <label>Layer hiện tại <select id="layerSelect"></select></label>
            <label>Màu layer <input id="layerColor" type="color" value="#21b8ff" /></label>
            <button id="deleteLayer" class="btn danger">Xóa layer</button>
          </article>

          <article class="panel">
            <h2>Timeline + Keyframes</h2>
            <label>Thời lượng (giây) <input id="timelineDuration" type="number" min="0.2" step="0.1" value="2" /></label>
            <div id="timelineTracks" class="timeline-tracks"></div>
            <div class="button-grid">
              <button id="addKeyBtn" class="btn">+ Keyframe tại thời điểm hiện tại</button>
              <button id="removeKeyBtn" class="btn danger">Xóa keyframe gần nhất</button>
            </div>
            <small id="keyframeInfo">Keyframes: -</small>

            <h3>Giá trị keyframe hiện tại</h3>
            <div class="field-grid">
              <label>X <input id="startX" type="number" value="180" /></label>
              <label>Y <input id="startY" type="number" value="320" /></label>
              <label>Scale <input id="startScale" type="number" step="0.1" value="1" /></label>
              <label>Rotate° <input id="startRotation" type="number" value="0" /></label>
              <label>Opacity <input id="startOpacity" type="number" step="0.05" min="0" max="1" value="1" /></label>
            </div>
            <label>Ease
              <select id="easing">
                <option value="linear">Linear</option>
                <option value="easeIn">Ease In</option>
                <option value="easeOut">Ease Out</option>
                <option value="easeInOut" selected>Ease In Out</option>
                <option value="custom">Custom Graph</option>
              </select>
            </label>
            <canvas id="easeGraph" width="320" height="160"></canvas>
            <div class="field-grid">
              <label>P1 X <input id="cp1x" type="range" min="0" max="1" step="0.01" value="0.25" /></label>
              <label>P1 Y <input id="cp1y" type="range" min="0" max="1" step="0.01" value="0.1" /></label>
              <label>P2 X <input id="cp2x" type="range" min="0" max="1" step="0.01" value="0.25" /></label>
              <label>P2 Y <input id="cp2y" type="range" min="0" max="1" step="0.01" value="1" /></label>
            </div>
            <button id="applyBtn" class="btn primary">Áp dụng vào keyframe hiện tại</button>
          </article>
        </section>
      </section>
    </main>

    <aside id="settingsMenu" class="menu hidden">
      <div class="menu-card">
        <h3>Project Menu</h3>
        <label>Tên dự án <input id="menuProjectName" type="text" /></label>
        <label>Tỉ lệ
          <select id="menuRatio">
            <option value="9:16">9:16</option><option value="16:9">16:9</option><option value="1:1">1:1</option><option value="3:4">3:4</option><option value="4:3">4:3</option>
          </select>
        </label>
        <label>FPS <input id="menuFps" type="number" min="12" max="120" value="30" /></label>
        <label>Màu nền <input id="menuBgColor" type="color" value="#000000" /></label>
        <div class="button-grid">
          <button id="saveMenuBtn" class="btn primary">Lưu project</button>
          <button id="closeMenuBtn" class="btn">Đóng</button>
        </div>
      </div>
    </aside>

    <div id="createProjectModal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <button id="closeModalBtn" class="icon-close" aria-label="Close">✕</button>
        <h2>Create Project</h2>
        <hr />
        <div class="ratio-row" id="ratioRow">
          <button class="ratio-btn selected" data-ratio="9:16">9:16</button>
          <button class="ratio-btn" data-ratio="16:9">16:9</button>
          <button class="ratio-btn" data-ratio="1:1">1:1</button>
          <button class="ratio-btn" data-ratio="3:4">3:4</button>
          <button class="ratio-btn" data-ratio="4:3">4:3</button>
        </div>
        <label>FPS <select id="modalFps"><option>24</option><option selected>30</option><option>60</option></select></label>
        <label>Name <input id="modalProjectName" type="text" placeholder="Enter project name here..." /></label>
        <label>BG color
          <div class="bg-row">
            <input id="modalBgColor" type="color" value="#000000" />
            <input id="modalBgHex" type="text" value="#000000" readonly />
          </div>
        </label>
        <button id="confirmCreateBtn" class="btn primary">Create</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
